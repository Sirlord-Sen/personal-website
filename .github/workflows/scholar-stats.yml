name: Update Scholar stats

on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday, 06:17 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch stats and update pages
        run: python scripts/update_scholar_stats.py

      - name: Sync publication list
        run: python scripts/update_publications.py

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update Google Scholar stats"
            git push
          fi
